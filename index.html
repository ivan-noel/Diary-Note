<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diary Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=Source+Code+Pro:wght@400;600&display=swap">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diary Note">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColorMeta" content="#0a0e17">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="titlebar">
    <button class="logo" id="appLogoButton" type="button" title="Choose a tab icon" aria-label="Choose a tab icon">
      <img id="appLogoImage" alt="Tab icon">
    </button>
    <div class="tabs" id="tabs"></div>
    <button class="tab-add" id="tabAdd" title="New tab (Ctrl+N)">+</button>
    <button class="win-btn" id="settingsBtn" title="Settings">⚙</button>
    <div class="win-controls" id="winControls">
      <button id="winMinBtn" title="Minimize">─</button>
      <button id="winMaxBtn" title="Maximize">□</button>
      <button id="winCloseBtn" title="Close">✕</button>
    </div>
  </div>
  <div class="menubar">
    <div class="menu"><button class="menu-btn" data-menu="file">File</button>
      <div class="menu-list" id="menuFile">
        <button data-cmd="new">New Tab / File<span>Ctrl+N</span></button>
        <button data-cmd="open">Open...<span>Ctrl+O</span></button>
        <button data-cmd="save">Save<span>Ctrl+S</span></button>
        <button data-cmd="saveas">Save As...<span>Ctrl+Shift+S</span></button>
        <div class="menu-sep"></div>
        <button data-cmd="image">Insert Image...</button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn" data-menu="view">View</button>
      <div class="menu-list menu-list-wide" id="menuView">
        <div class="zoom-row">
          <button id="zoomOut" title="Zoom out">−</button>
          <input type="range" id="zoomSlider" min="25" max="300" step="5" value="100">
          <button id="zoomIn" title="Zoom in">+</button>
        </div>
        <div class="zoom-value" id="zoomValueLabel">100%</div>
        <div class="menu-sep"></div>
        <div class="zoom-presets">
          <button data-zoom="50">50%</button>
          <button data-zoom="75">75%</button>
          <button data-zoom="100">100%</button>
          <button data-zoom="125">125%</button>
          <button data-zoom="150">150%</button>
          <button data-zoom="200">200%</button>
        </div>
      </div>
    </div>
    <div class="menu"><button class="menu-btn" data-menu="settings">Settings</button>
      <div class="menu-list" id="menuSettings">
        <button data-cmd="opensettings">Open Settings Panel</button>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <select id="fontFamily" title="Font">
      <option value="Fira Code">Fira Code</option>
      <option value="Source Code Pro">Source Code Pro</option>
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
      <option value="Tahoma">Tahoma</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Segoe UI">Segoe UI</option>
      <option value="Calibri">Calibri</option>
      <option value="Cambria">Cambria</option>
      <option value="Georgia">Georgia</option>
      <option value="Garamond">Garamond</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Courier New">Courier New</option>
      <option value="Consolas">Consolas</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
      <option value="Impact">Impact</option>
      <option value="Roboto">Roboto</option>
      <option value="Open Sans">Open Sans</option>
      <option value="Lato">Lato</option>
      <option value="Merriweather">Merriweather</option>
      <option value="Poppins">Poppins</option>
      <option value="Montserrat">Montserrat</option>
    </select>
    <select id="fontSize" title="Font size">
      <option>10</option><option>11</option><option>12</option><option selected>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option>
    </select>
    <div class="tsep"></div>
    <button data-cmd="bold" title="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline"><u>U</u></button>
    <div class="tsep"></div>
    <select id="blockStyle" title="Paragraph style">
      <option value="P">Normal</option>
      <option value="H1">Heading 1</option>
      <option value="H2">Heading 2</option>
      <option value="H3">Heading 3</option>
    </select>
    <div class="tsep"></div>
    <button data-cmd="justifyLeft" title="Align left"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="12" y2="12"/></svg></button>
    <button data-cmd="justifyCenter" title="Align center"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg></button>
    <button data-cmd="justifyRight" title="Align right"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="4" y1="12" x2="14" y2="12"/></svg></button>
    <div class="tsep"></div>
    <button data-cmd="insertUnorderedList" title="Bullet list"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="2.3" cy="4" r="1.1" fill="currentColor" stroke="none"/><line x1="6" y1="4" x2="14" y2="4"/><circle cx="2.3" cy="8" r="1.1" fill="currentColor" stroke="none"/><line x1="6" y1="8" x2="14" y2="8"/><circle cx="2.3" cy="12" r="1.1" fill="currentColor" stroke="none"/><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
    <button data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><text x="0.3" y="5.2" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="600">1</text><line x1="6" y1="4" x2="14" y2="4"/><text x="0.3" y="9.2" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="600">2</text><line x1="6" y1="8" x2="14" y2="8"/><text x="0.3" y="13.2" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="600">3</text><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
    <div class="tsep"></div>
    <button data-cmd="image" title="Insert image">🖼</button>
  </div>
  <div class="editor-wrap" id="editorWrap"><div class="wallpaper-layer" id="wallpaperLayer" aria-hidden="true"></div><div class="editor" id="editor" contenteditable="true" spellcheck="false"></div></div>
  <div class="statusbar"><span id="statusMsg">Ready</span><span id="zoomLabel">100%</span></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="sp-head"><span>Settings</span><button id="spClose" title="Close">✕</button></div>
  <div class="sp-body">
    <div class="sp-row"><label>Theme color</label>
      <div class="seg"><button data-theme="dark">Dark</button><button data-theme="light">Light</button></div>
      <input type="color" id="themeColorPicker" value="#0a0e17" style="margin-top:8px">
      <small class="setting-note">Pick any color you like — Dark/Light above are just quick presets.</small>
    </div>
    <div class="sp-row"><label>Header color</label>
      <label class="check-row"><input type="checkbox" id="headerFollowTheme" checked> Follow main theme</label>
      <input type="color" id="headerColorPicker" value="#10141f">
    </div>
    <div class="sp-row"><label>Tab icon</label>
      <div class="icon-setting">
        <div class="icon-preview"><img id="iconPreview" alt="Tab icon preview"></div>
        <div class="icon-actions">
          <button id="chooseIconButton" type="button">Choose icon...</button>
          <button id="clearIconButton" type="button">Remove icon</button>
        </div>
      </div>
      <small class="setting-note">Choose any image you like. This icon appears inside Diary Note next to the tabs; it does not change the Windows app icon.</small>
    </div>
    <div class="sp-row"><label>Wallpaper</label>
      <input type="file" id="wallpaperInput" accept="image/*">
      <button id="wallpaperClear">Remove wallpaper</button>
      <small class="setting-note">Your wallpaper is resized automatically so it can be saved reliably.</small>
    </div>
    <div class="sp-row"><label>Editor background color</label><input type="color" id="bgColor" value="#10141f"></div>
    <div class="sp-row"><label>Background opacity (<span id="opacityVal">55</span>%)</label>
      <input type="range" id="bgOpacity" min="0" max="100" value="55">
    </div>
  </div>
</div>
<input type="file" id="appIconInput" accept="image/*" style="display:none">
<input type="file" id="fileOpenInput" accept=".txt,.text,text/plain" style="display:none">
<input type="file" id="imageInput" accept="image/*" style="display:none">

<script src="script.js" defer></script>
</body>
</html>
